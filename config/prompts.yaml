text_generation_templates:
  simple: "Generate text description for: {target}"
  thermal: "Generate thermal-aware description for: {target}, thermal state: {thermal_state}"
  spatial: "Generate spatial description for: {target}, location: {location}"
  distant: "Generate distant target description for: {target}, distance: {distance}"
  hidden: "Generate hidden/obscured target description for: {target}, obstruction: {obstruction}"

evaluation_template:
  dimensions:
    - name: 完整性
      description: 文本是否完整描述目标的所有关键特征
