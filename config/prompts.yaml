      description: 文本描述是否与图像内容一致
    - name: 简洁性
      description: 文本是否简洁明了，无冗余
    - name: 领域适配性
      description: 文本是否使用了正确的领域术语
    - name: 热特征描述
      description: 红外图像的热特征是否被正确描述

regeneration_template: "请根据以下反馈重新生成描述：{feedback}"